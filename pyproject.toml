[project]
name = "gymbot-core"
version = "0.5.0"
description = "GymBot: dominio, repositorio DynamoDB e calculos de treino"
readme = "README.md"
authors = [
    { name = "João", email = "galhardojoaopedro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
    "pydantic>=2.14.1",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[dynamodb,secretsmanager,ssm]>=5.2.4",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "moto"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
