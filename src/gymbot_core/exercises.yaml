# Catalogo de exercicios (specs/dados.md). `name` e o nome canonico exibido; `aliases` sao
# variacoes que usuarios escrevem. Comparacao ignora acentos, caixa e pontuacao.
# Exercicio fora daqui vira `custom:<slug>` e fica marcado para revisao.

